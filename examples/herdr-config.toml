onboarding = false

# catppuccin is the default theme; these match the herdr.dev demo
[theme.custom]
accent = "#cba6f7"
sidebar_bg = "#181825"
surface_dim = "#313244" # separator lines; the default equals the terminal background
panel_bg = "reset"      # tab bar and panes use Ghostty's own background

[ui]
pane_borders = "auto"                   # frames only between split panes
pane_scrollbars = false                 # the scrollbar column made frames uneven
show_agent_labels_on_pane_borders = false
status_indicators = "symbols"           # blocked / working / done distinguishable by shape, not just color
agent_panel_sort = "priority"           # agents waiting on you float to the top
window_title = "{workspace} · {tab}"    # the hostname rarely helps; drop it
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = "~/.local/share/kebbie/current/scripts/sync.sh", interval_seconds = 3, timeout_seconds = 3 }, # kebbie's sidebar sync; prints nothing
  { type = "datetime", format = "%H:%M" },
]

# $server and $worker are reported by sync.sh while the dev server the board's w key started, or the worker its b key started, runs in the Space.
# The default branch is the norm, so it fades; any other branch stands out.
[ui.sidebar.spaces]
row_gap = 1
rows = [
  ["state_icon", "workspace", { token = "$server", fg = "#a6e3a1" }, { token = "$worker", fg = "#a6e3a1" }],
  [{ token = "branch", fg = "#fab387", bold = true, rules = [
    { equals = "master", fg = "#6c7086", bold = false },
    { equals = "main", fg = "#6c7086", bold = false },
  ] }, "git_status"],
]

[ui.sidebar.agents]
row_gap = 1

# Claude's task title, plus model and context in use ($model / $ctx from sync.sh) in place of the agent and tab names,
# and a kebbie task's last report: its state in place of idle or done, and your next step ($next).
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "workspace", { token = "$model", dim = true }, { token = "$ctx", fg = "#f9e2af" }],
  [{ token = "terminal_title_stripped", fg = "#bac2de" }],
  ["state_text", { token = "$next", fg = "#fab387" }],
]

# Claude finishing or asking in a background Space; Ghostty shows it as a macOS notification
[ui.toast]
delivery = "terminal"
delay_seconds = 3

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "kebbie.lead"
description = "kebbie: go to the lead, or back"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "kebbie.focus"
description = "kebbie: between the board and the lead's chat"

[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "kebbie.board"
description = "kebbie board"
