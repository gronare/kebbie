# The Areas page's actions for notes-vault-mcp: copy to the repo's root as .kelpie.toml,
# or to ~/.config/kelpie/actions/notes-vault-mcp.toml to keep it out of the repo.

[[actions]]
key = "R"
title = "Release"
about = "bump the version, commit, tag, push; PyPI publishes on the tag"
ask = "version"                           # prefilled with the next patch
bump = [
  "pyproject.toml",
  "server.json",
  "notes_vault_mcp/server.py",
  { file = "uv.lock", after = 'name = "notes-vault-mcp"' },   # only this package's version
]
commit = "{version}"
tag = "v{version}"
push = true                               # asks again, then pushes main and the tag as you
then = ["claude-plugins:bump-pin"]        # offered next, never run on its own

