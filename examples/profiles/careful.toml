# Copy to ~/.config/kelpie/profiles/careful.toml, with careful.md beside it.
about = "Risky changes: plan first, the strongest model, nothing destructive"
for = "migrations, money, authentication, permissions, data deletion"
model = "opus"
effort = "max"
role = "careful.md"
permission_mode = "plan"
deny = ["Bash(rm -rf:*)", "Bash(git reset --hard:*)", "Bash(git clean:*)"]
