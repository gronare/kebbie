id = "kelpie"
name = "kelpie"
version = "0.5.0"
min_herdr_version = "0.9.0"
description = "Tasks in pooled git worktrees with Claude, and a sidebar sync"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release"]

[[startup]]
command = ["sh", "scripts/herdr-startup.sh"]

[[actions]]
id = "lead"
title = "Go to the lead, or back"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead"]

[[actions]]
id = "board"
title = "Board"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin kelpie --entrypoint board --placement overlay"]

[[panes]]
id = "board"
title = "kelpie"
placement = "overlay"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" board --overlay"]
