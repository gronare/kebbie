id = "kelpie"
name = "kelpie"
version = "0.26.4"
min_herdr_version = "0.9.0"
description = "Tasks in pooled git worktrees with Claude, and a sidebar sync"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/build.sh"]

[[startup]]
command = ["sh", "scripts/herdr-startup.sh"]

[[events]]
on = "workspace.created"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead --first"]

[[events]]
on = "workspace.moved"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead --first"]

[[events]]
on = "workspace.reordered"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead --first"]

[[actions]]
id = "lead"
title = "Go to the lead, or back"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead"]

[[actions]]
id = "focus"
title = "Move focus between the board and the lead"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" focus"]

[[actions]]
id = "chat"
title = "Hide or show the lead's chat"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" lead --toggle-chat"]

[[actions]]
id = "board"
title = "Board"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin kelpie --entrypoint board"]

[[actions]]
id = "update"
title = "Update kelpie"
contexts = ["workspace"]
command = ["sh", "-c", "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin kelpie --entrypoint update"]

[[panes]]
id = "update"
title = "kelpie update"
placement = "popup"
width = "70%"
height = "60%"
command = ["sh", "-c", "\"$HERDR_PLUGIN_ROOT/target/release/kelpie\" update; printf '\\nenter closes'; read -r _"]

[[panes]]
id = "board"
title = "kelpie"
placement = "popup"
width = "85%"
height = "85%"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/target/release/kelpie\" board --overlay"]
