[package]
name = "kebbie"
version = "0.29.1"
edition = "2024"
rust-version = "1.90"
description = "Herding coding agents in herdr"
license = "MIT"
repository = "https://github.com/gronare/kebbie"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kebbie-hub-api = { git = "https://github.com/gronare/kebbie-hub", rev = "3ffa7f0ea82b8cfc0714c2cdac5f3baea29f5bbd" }
kebbie-hub-protocol = { git = "https://github.com/gronare/kebbie-hub", rev = "3ffa7f0ea82b8cfc0714c2cdac5f3baea29f5bbd" }
libc = "0.2"
qrcodegen = "1.8"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1.0.1"
sha2 = "0.10"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tui-markdown = { version = "0.3.12", default-features = false }
unicode-width = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
kebbie-hub = { git = "https://github.com/gronare/kebbie-hub", rev = "3ffa7f0ea82b8cfc0714c2cdac5f3baea29f5bbd" }
kebbie-hub-fakes = { git = "https://github.com/gronare/kebbie-hub", rev = "3ffa7f0ea82b8cfc0714c2cdac5f3baea29f5bbd" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

[profile.release]
strip = true
