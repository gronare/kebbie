[package]
name = "kelpie"
version = "0.26.3"
edition = "2024"
rust-version = "1.90"
description = "Herding coding agents in herdr"
license = "MIT"
repository = "https://github.com/gronare/kelpie"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kelpie-hub-api = { git = "https://github.com/gronare/kelpie-hub", rev = "98d83271a237d6ab44f54ced0704e0af5ba732f3" }
kelpie-hub-protocol = { git = "https://github.com/gronare/kelpie-hub", rev = "98d83271a237d6ab44f54ced0704e0af5ba732f3" }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1.0.1"
sha2 = "0.10"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tui-markdown = { version = "0.3.12", default-features = false }
unicode-width = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[dev-dependencies]
kelpie-hub = { git = "https://github.com/gronare/kelpie-hub", rev = "98d83271a237d6ab44f54ced0704e0af5ba732f3" }
kelpie-hub-fakes = { git = "https://github.com/gronare/kelpie-hub", rev = "98d83271a237d6ab44f54ced0704e0af5ba732f3" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

[profile.release]
strip = true
