[package]
name = "kebbie"
version = "0.41.0"
edition = "2024"
rust-version = "1.90"
description = "Herding coding agents in herdr"
license = "MIT"
repository = "https://github.com/gronare/kebbie"

[dependencies]
# macOS kqueue rejects /dev/tty, and install.sh runs kebbie setup with </dev/tty; this feature polls it instead.
base64 = "0.23"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
ed25519-dalek = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
kebbie-hub-api = { git = "https://github.com/gronare/kebbie-hub", rev = "e12e795c7705e2b5f04ec317f471ed1c02ab855c" }
kebbie-hub-protocol = { git = "https://github.com/gronare/kebbie-hub", rev = "e12e795c7705e2b5f04ec317f471ed1c02ab855c" }
libc = "0.2"
qrcodegen = "1.8"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1_smol = "1.0.1"
sha2 = "0.10"
tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
tui-markdown = { version = "0.3.12", default-features = false }
unicode-width = "0.2"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.10"
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
kebbie-hub = { git = "https://github.com/gronare/kebbie-hub", rev = "e12e795c7705e2b5f04ec317f471ed1c02ab855c" }
kebbie-hub-fakes = { git = "https://github.com/gronare/kebbie-hub", rev = "e12e795c7705e2b5f04ec317f471ed1c02ab855c" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }

[profile.release]
strip = true
