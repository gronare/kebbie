[package]
name = "kelpie"
version = "0.25.0"
edition = "2024"
description = "Herding coding agents in herdr"
license = "MIT"
repository = "https://github.com/gronare/kelpie"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
libc = "0.2"
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
sha1_smol = "1.0.1"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }
tui-markdown = { version = "0.3.12", default-features = false }
unicode-width = "0.2"

[profile.release]
strip = true
