[package]
name = "kelpie"
version = "0.13.2"
edition = "2024"
description = "Herding coding agents in herdr"
license = "MIT"
repository = "https://github.com/gronare/kelpie"

[dependencies]
ratatui = "0.30"
ratatui-textarea = "0.9"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1"
sha1_smol = "1.0.1"
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }

[profile.release]
strip = true
