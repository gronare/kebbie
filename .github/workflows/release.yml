name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in every manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          herdr=$(sed -n 's/^version = "\(.*\)"/\1/p' herdr-plugin.toml | head -1)
          claude=$(jq -r .version .claude-plugin/plugin.json)
          for found in "Cargo.toml $cargo" "herdr-plugin.toml $herdr" ".claude-plugin/plugin.json $claude"; do
            set -- $found
            if [ "$2" != "$tag" ]; then echo "::error::$1 says $2, the tag says $tag"; exit 1; fi
          done

  test:
    needs: [version]
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
      HERDR_BIN_PATH: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain rust-toolchain.toml pins
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          mkdir -p "$RUNNER_TEMP/state"
          KELPIE_STATE_DIR="$RUNNER_TEMP/state" cargo test --locked

  binaries:
    needs: [test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-14, runs: true }
          - { target: x86_64-apple-darwin, runner: macos-14, runs: false }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04, runs: true }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm, runs: true }
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain rust-toolchain.toml pins, with the target
        run: |
          rustup toolchain install
          rustup target add ${{ matrix.target }}
      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: The binary starts
        if: matrix.runs
        run: target/${{ matrix.target }}/release/kelpie help > /dev/null
      - name: Pack kelpie-<version>-<target>.tar.gz
        run: |
          mkdir dist
          tar -czf "dist/kelpie-${GITHUB_REF_NAME#v}-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release kelpie
      - uses: actions/upload-artifact@v4
        with:
          name: kelpie-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS over every binary
        working-directory: dist
        run: |
          set -- kelpie-*.tar.gz
          [ $# -eq 4 ] || { echo "::error::expected 4 binaries, got $*"; exit 1; }
          sha256sum kelpie-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Draft a GitHub Release with the binaries and notes from the commits since the last tag
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber kelpie-*.tar.gz SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "kelpie ${GITHUB_REF_NAME#v}" kelpie-*.tar.gz SHA256SUMS
          fi
      - name: Publish the release once every binary and SHA256SUMS is attached
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          attached=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | sort)
          expected=$(ls kelpie-*.tar.gz SHA256SUMS | sort)
          [ "$attached" = "$expected" ] || { echo "::error::attached $attached, expected $expected"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
