[sources]
allow-git = ["https://github.com/gronare/kebbie-hub"]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# MPL-2.0 is file-level copyleft: linking it into an MIT binary is fine as long as these crates' own files stay unmodified.
[[licenses.exceptions]]
crate = "base64urlsafedata"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "webauthn-rs-proto"
allow = ["MPL-2.0"]
