<!doctype html>
<meta charset="utf-8">
<title>Saved carts</title>
<style>
  body { margin: 0; font: 16px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d2433; background: #f5f3ee; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 40px; background: #1f3b33; color: #f5f3ee; }
  header b { font-size: 22px; letter-spacing: .5px; }
  main { padding: 28px 40px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .note { margin: 0 0 22px; color: #5b6472; }
  .note strong { color: #1f6f4a; }
  .item { display: flex; justify-content: space-between; align-items: center; background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
  .thumb { width: 52px; height: 52px; border-radius: 8px; margin-right: 16px; }
  .left { display: flex; align-items: center; }
  .total { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; font-size: 20px; }
  button { font: inherit; font-weight: 600; background: #1f6f4a; color: #fff; border: 0; border-radius: 8px; padding: 12px 26px; }
</style>
<header><b>shop</b><span>Robin · signed in on a second device</span></header>
<main>
  <h1>Your cart</h1>
  <p class="note">Saved 3 days ago on your laptop · <strong>kept for 30 days</strong></p>
  <div class="item"><div class="left"><div class="thumb" style="background:#c9a66b"></div>Linen shirt · size M</div><span>€49.00</span></div>
  <div class="item"><div class="left"><div class="thumb" style="background:#4d6a8a"></div>Canvas sneakers · size 42</div><span>€79.00</span></div>
  <div class="item"><div class="left"><div class="thumb" style="background:#8a4d5c"></div>Wool socks · 2 pairs</div><span>€18.00</span></div>
  <div class="total"><span>Total <b>€146.00</b></span><button>Checkout</button></div>
</main>
