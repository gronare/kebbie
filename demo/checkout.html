<!doctype html>
<meta charset="utf-8">
<title>Checkout</title>
<style>
  body { margin: 0; font: 16px/1.45 -apple-system, "Helvetica Neue", Arial, sans-serif; color: #1d2433; background: #f5f3ee; }
  header { padding: 18px 40px; background: #1f3b33; color: #f5f3ee; font-size: 22px; font-weight: 700; }
  main { padding: 28px 40px; }
  h1 { margin: 0 0 18px; font-size: 28px; }
  .declined { background: #fbe9e7; color: #8a2a1d; border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; }
  .row { display: flex; justify-content: space-between; background: #fff; border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; }
  .muted { color: #5b6472; }
  button { margin-top: 14px; font: inherit; font-weight: 600; background: #1f6f4a; color: #fff; border: 0; border-radius: 8px; padding: 12px 26px; }
</style>
<header>shop</header>
<main>
  <h1>Checkout</h1>
  <div class="declined">Your card was declined. Try another card or contact your bank.</div>
  <div class="row"><span>3 items</span><span>€146.00</span></div>
  <div class="row"><span class="muted">You see the shipping cost before you pay</span><span class="muted">—</span></div>
  <button>Pay now</button>
</main>
